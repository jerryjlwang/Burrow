<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>New Tab</title>
    <style>
      :root { color-scheme: light dark; --fg: #1c1a2e; --muted: #6b6884; --bg: #f7f5ff; --card: rgba(255,255,255,.8); --line: rgba(28,26,46,.08); --accent: #7c5cff; }
      @media (prefers-color-scheme: dark) { :root { --fg: #f3f0ff; --muted: #aaa6c4; --bg: #15132a; --card: rgba(255,255,255,.06); --line: rgba(255,255,255,.1); } }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body { margin: 0; font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: var(--fg); background: radial-gradient(1100px 600px at 15% -10%, rgba(124,92,255,.22), transparent 60%), radial-gradient(900px 500px at 110% 0%, rgba(255,154,120,.18), transparent 60%), var(--bg); }
      main { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 48px 24px 120px; gap: 28px; }
      .clock { font-size: 64px; font-weight: 700; letter-spacing: -0.03em; line-height: 1; margin: 0; }
      .greet { margin: 6px 0 0; color: var(--muted); font-size: 18px; }
      form.search { width: min(680px, 100%); }
      .search-box { display: flex; align-items: center; gap: 12px; width: 100%; background: var(--card); backdrop-filter: blur(16px); border: 1px solid var(--line); border-radius: 999px; padding: 14px 22px; box-shadow: 0 18px 48px rgba(30,20,70,.12); }
      .search-box:focus-within { border-color: var(--accent); box-shadow: 0 0 0 4px rgba(124,92,255,.18), 0 18px 48px rgba(30,20,70,.12); }
      .search-box input { flex: 1; border: 0; background: transparent; color: var(--fg); font-size: 18px; font-family: inherit; outline: none; }
      .search-box input::placeholder { color: var(--muted); }
      .search-box svg { color: var(--muted); flex-shrink: 0; }
      .shortcuts { display: grid; grid-template-columns: repeat(auto-fit, 96px); justify-content: center; gap: 10px; width: min(820px, 100%); }
      .shortcut { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 12px 6px; border-radius: 16px; text-decoration: none; color: var(--fg); font-size: 13px; transition: background .15s ease, transform .15s ease; }
      .shortcut:hover { background: var(--card); transform: translateY(-2px); }
      .shortcut .icon { width: 48px; height: 48px; border-radius: 50%; background: var(--card); border: 1px solid var(--line); display: grid; place-items: center; }
      .shortcut img { width: 24px; height: 24px; }
      .shortcut span { max-width: 88px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .hint { color: var(--muted); font-size: 14px; margin: 0; }
      .hint b { color: var(--fg); font-weight: 600; }
      .empty { color: var(--muted); font-size: 13px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="newtab.js"></script>
  </body>
</html>
