<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>New Tab</title>
    <link rel="stylesheet" href="burrow.css" />
    <style>
      /* The meadow is a full window canvas at 3x behind everything; the UI is pinned to the ground line
         so the signs stay planted whatever the window height. All offsets are multiples of 3. */
      html, body { height: 100%; overflow: hidden; }
      body { background-image: none; background-color: #2c1f1a; }
      canvas.scene { position: fixed; left: 0; top: 0; z-index: 0; image-rendering: pixelated; cursor: url("scene/cursor_arrow.png") 1 1, auto; }
      .ui { position: fixed; inset: 0; z-index: 1; pointer-events: none; }
      .ui > * { pointer-events: auto; }
      .hidden { visibility: hidden; }
      /* Off stage during the boot: fully clipped but still present, so the page extractor can see the sign. */
      .offstage { clip-path: inset(0 0 100% 0); }

      .clockwrap { position: absolute; top: 7vh; left: 0; right: 0; text-align: center; pointer-events: none; }
      .clock { display: block; margin: 0 auto; image-rendering: pixelated; }

      /* Signs drop in during the boot: three whole pixel steps and a one frame squash. */
      .drop-1 { transform: translateY(-60px); }
      .drop-2 { transform: translateY(-30px); }
      .drop-3 { transform: translateY(-9px); }
      .squash { transform: translateY(3px); }

      /* Search: a painted plank on two posts, planted in the grass. */
      .search { position: absolute; left: 0; right: 0; bottom: 39px; display: flex; flex-direction: column; align-items: center; pointer-events: none; }
      .search .board { pointer-events: auto; position: relative; width: min(630px, calc(100% - 48px)); height: 72px; border: 15px solid transparent; border-image: url("scene/sign.png") 5 fill / 15px repeat; image-rendering: pixelated; box-shadow: var(--shadow); cursor: text; }
      /* Focus lifts the plank onto a gold ring; an empty Enter shakes it; a real Enter stamps it. */
      .search .board:focus-within { box-shadow: 6px 6px 0 rgba(59, 42, 35, 0.25), 0 0 0 3px var(--gold); transform: translateY(-3px); }
      .search .board.shake { animation: shake 240ms steps(4, end); }
      .search .board.stamp { animation: stamp 160ms steps(2, end); }
      @keyframes shake { 0% { transform: translate(-6px, -3px); } 50% { transform: translate(6px, -3px); } 100% { transform: translate(0, -3px); } }
      @keyframes stamp { 0% { transform: translateY(3px); } 100% { transform: translateY(-3px); } }
      /* The carrot is the enter key: it bobs when hovered, nods when there is something to ask, and is plucked on Enter. */
      .search .carrot { position: absolute; right: 9px; top: 50%; width: 21px; height: 36px; margin-top: -18px; padding: 0; border: 0; background: url("scene/carrot.png") no-repeat; background-size: 21px 36px; image-rendering: pixelated; cursor: pointer; opacity: 0.55; transform-origin: 50% 90%; }
      .search .carrot:hover, .search .carrot:focus-visible { animation: bob 360ms steps(2, end) infinite; outline: none; }
      .search .carrot.ready { opacity: 1; animation: nod 900ms steps(2, end) infinite; }
      .search .carrot.ready:hover, .search .carrot.ready:focus-visible { animation: bob 360ms steps(2, end) infinite; }
      .search .carrot.plucked { animation: pluck 260ms steps(3, end) forwards; }
      @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
      @keyframes nod { 0%, 100% { transform: rotate(-6deg); } 50% { transform: rotate(6deg); } }
      @keyframes pluck { 0% { transform: translateY(0); } 40% { transform: translateY(-15px) rotate(-12deg); } 100% { transform: translateY(-42px) rotate(-24deg); opacity: 0; } }
      .search .dirt { position: absolute; right: 12px; top: 50%; width: 15px; height: 9px; margin-top: 12px; pointer-events: none; opacity: 0; background: radial-gradient(circle, var(--ink) 1.5px, transparent 1.5px) 0 0 / 5px 5px; image-rendering: pixelated; }
      .search .dirt.puff { animation: puff 300ms steps(3, end) forwards; }
      @keyframes puff { 0% { opacity: 1; transform: translateY(0) scaleX(1); } 100% { opacity: 0; transform: translateY(-12px) scaleX(1.6); } }
      @media (prefers-reduced-motion: reduce) { .search .board, .search .carrot, .search .dirt { animation: none !important; } }
      .search input { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; margin: 0; padding: 0 39px 0 9px; background: transparent; color: transparent; caret-color: transparent; font-size: 20px; outline: none; }
      .search input::placeholder { color: transparent; }
      .search input::selection { background: rgba(47, 143, 131, 0.35); }
      .mirror { position: absolute; inset: 0; display: flex; align-items: center; padding: 0 39px 0 9px; font-size: 20px; line-height: 1; white-space: pre; overflow: hidden; color: var(--ink); }
      .mirror.tail { direction: rtl; }
      .mirror .inner { direction: ltr; unicode-bidi: isolate; display: inline-block; }
      .mirror .ph { color: var(--muted); }
      .mirror .pop { display: inline-block; font-weight: 400; animation: pop 120ms steps(1, end); }
      @keyframes pop { 0% { transform: translateY(-6px); } 50% { transform: translateY(-3px); } 100% { transform: translateY(0); } }
      .caret { display: none; width: 3px; height: 21px; background: var(--ink); margin-left: 2px; vertical-align: -3px; }
      .board:focus-within .caret { display: inline-block; animation: blink 1s steps(1, end) infinite; }
      .board.demo-type .caret, .board.demo-delete .caret, .board.demo-gap .caret { display: inline-block; background: var(--muted); }
      .board.demo-hold .caret { display: inline-block; background: var(--muted); animation: blink 1s steps(1, end) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      .legs { display: flex; justify-content: space-between; width: min(630px, calc(100% - 48px)); padding: 0 96px; margin-top: -3px; }
      .leg { width: 18px; height: 93px; background: url("scene/post.png") repeat-y; background-size: 18px 18px; image-rendering: pixelated; }

      /* Top sites: small signs on short posts along the hedge line. */
      /* Signposts on the far ridge: a favicon each, the name on a sign when hovered or focused. */
      .shortcuts { position: absolute; display: flex; gap: 9px; pointer-events: none; }
      .shortcut { pointer-events: auto; display: flex; flex-direction: column; align-items: center; width: 54px; text-decoration: none; color: var(--ink); }
      .shortcut:hover, .shortcut:focus-visible { transform: translateY(-3px); outline: none; }
      .shortcut .board { width: 54px; height: 54px; border: 15px solid transparent; border-image: url("scene/sign.png") 5 fill / 15px repeat; image-rendering: pixelated; display: grid; place-items: center; box-shadow: var(--shadow); }
      .shortcut:hover .board, .shortcut:focus-visible .board { box-shadow: 6px 6px 0 rgba(59, 42, 35, 0.25); }
      .shortcut img { display: block; width: 24px; height: 24px; image-rendering: auto; }
      .shortcut .post, .hud-sign .post, .concept-sign .post { width: 18px; height: 15px; margin-top: -3px; background: url("scene/post.png") repeat-y; background-size: 18px 18px; image-rendering: pixelated; }
      .empty { position: absolute; left: 0; right: 0; margin: 0; text-align: center; color: var(--cream); text-shadow: 3px 3px 0 var(--ink); font-size: 17px; pointer-events: none; }

      /* The hint is a note pinned in the top right of the sky. */
      .hint { position: absolute; right: 18px; top: 18px; margin: 0; width: max-content; max-width: 300px; font-size: 17px; line-height: 1.25; min-height: 51px; pointer-events: none; }
      .hint b { font-weight: 400; color: var(--teal-deep); }
      .hint.gone { opacity: 0; transition: opacity 0.6s ease; }
      @media (prefers-reduced-motion: reduce) { .hint.gone { display: none; transition: none; } }

      /* Bottom left: cream signs on posts for what he learned, the weather, and the speaker. */
      .hud { position: absolute; left: 18px; bottom: 18px; display: flex; align-items: flex-end; gap: 9px; pointer-events: none; }
      .hud-sign { display: flex; flex-direction: column; align-items: center; pointer-events: auto; }
      /* 57px boards: 27px inside the painted rim, room for 19px text or the 33 x 27 speaker. */
      /* Plain rounded frames: no browser button background and no square shadow peeking out at the corners. */
      .hud-sign .board { display: grid; place-items: center; min-width: 51px; height: 57px; padding: 0 6px; border: 15px solid transparent; border-image: url("ui/bubble.png") 5 fill / 15px repeat; image-rendering: pixelated; background: none; border-radius: 0; font-size: 17px; line-height: 27px; white-space: nowrap; color: var(--ink); }
      .hud-sign .speaker { cursor: pointer; padding: 0; margin: 0; width: 63px; }
      .hud-sign .sites { cursor: pointer; margin: 0; font: inherit; font-size: 17px; line-height: 27px; }
      .hud-sign .sites[aria-pressed="true"] { color: var(--teal-deep); }
      .hud-sign .sites:active { transform: translateY(3px); }
      /* The sky sign: which light the meadow keeps, named like the others. */
      .hud-sign .sky { cursor: pointer; margin: 0; font: inherit; font-size: 17px; line-height: 27px; }
      .hud-sign .sky:active { transform: translateY(3px); }
      .hud-sign .sky[data-pinned="1"] { color: var(--teal-deep); }
      .hud-sign .speaker img { display: block; image-rendering: pixelated; }
      .hud-sign .speaker:active { transform: translateY(3px); }

      /* Hovering a concept flower: its name on a little wooden sign. */
      .concept-sign { position: absolute; display: flex; flex-direction: column; align-items: center; pointer-events: none; }
      .concept-sign .board { display: block; padding: 0 6px; height: 51px; line-height: 21px; max-width: 420px; border: 15px solid transparent; border-image: url("scene/sign.png") 5 fill / 15px repeat; image-rendering: pixelated; font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--ink); box-shadow: var(--shadow); }
      .concept-sign.below { flex-direction: column-reverse; }
      .concept-sign.below .post { margin-top: 0; margin-bottom: -3px; }
      .concept-sign.beside .post { display: none; }
      .concept-sign.pinned .board { white-space: normal; width: 306px; height: auto; min-height: 60px; padding: 6px 9px; text-align: center; line-height: 1.2; }

      /* The boot line: what is being dug up, and a bar of whole blocks. */
      .boot { position: absolute; left: 18px; bottom: 18px; pointer-events: none; color: var(--cream); font-size: 17px; }
      .boot-line { margin: 0 0 9px; white-space: pre; }
      .boot-line b { font-weight: 400; color: var(--gold); letter-spacing: 3px; }
      .boot-bar { display: flex; gap: 3px; }
      .boot-bar span { width: 9px; height: 9px; background: rgba(255, 248, 231, 0.2); }
      .boot-bar span.on { background: var(--gold); }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="newtab.js"></script>
  </body>
</html>
