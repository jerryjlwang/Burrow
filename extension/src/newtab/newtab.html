<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>New Tab</title>
    <link rel="stylesheet" href="burrow.css" />
    <style>
      main { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 48px 24px 150px; gap: 30px; }
      .clock { font-size: 72px; line-height: 1; margin: 0; text-align: center; }
      .greet { margin: 9px 0 0; color: var(--muted); font-size: 20px; text-align: center; }
      form.search { width: min(660px, 100%); }
      .search-box { display: flex; align-items: center; gap: 12px; width: 100%; border: 15px solid transparent; border-image: url("ui/bubble.png") 5 fill / 15px repeat; image-rendering: pixelated; box-shadow: var(--shadow); }
      .search-box:focus-within { box-shadow: 0 0 0 3px var(--gold); }
      .search-box input { flex: 1; min-width: 0; border: 0; background: transparent; font-size: 20px; outline: none; }
      .search-box svg { color: var(--muted); flex-shrink: 0; }
      .shortcuts { display: grid; grid-template-columns: repeat(auto-fit, 96px); justify-content: center; gap: 12px; width: min(820px, 100%); }
      .shortcut { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 6px 3px 9px; text-decoration: none; color: var(--ink); font-size: 15px; }
      .shortcut .icon { width: 54px; height: 54px; display: grid; place-items: center; border: 12px solid transparent; border-image: url("ui/button_quiet.png") 4 fill / 12px repeat; image-rendering: pixelated; box-shadow: 3px 3px 0 rgba(59, 42, 35, 0.2); }
      .shortcut:hover .icon { border-image-source: url("ui/button.png"); }
      .shortcut img { width: 24px; height: 24px; image-rendering: auto; }
      .shortcut span:last-child { max-width: 90px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .hint { color: var(--muted); font-size: 17px; margin: 0; text-align: center; }
      .hint b { color: var(--ink); font-weight: 400; }
      .empty { color: var(--muted); font-size: 15px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="newtab.js"></script>
  </body>
</html>
