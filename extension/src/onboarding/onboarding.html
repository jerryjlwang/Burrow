<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Meet the White Rabbit</title>
    <link rel="stylesheet" href="burrow.css" />
    <style>
      /* The card hangs from a fixed top offset, never the vertical centre, so its edges stay on whole
         pixels whatever its height. Widths: card 560, frame 15, padding 9, inner 512. */
      body { padding: 48px 24px 60px; }
      #root { width: 100%; max-width: 560px; margin: 0 auto; }
      .card { padding: 6px 9px 9px; }
      h1 { margin: 0 0 9px; font-size: 30px; line-height: 36px; }
      p { color: var(--muted); margin: 0 0 12px; }
      /* Three bars, 168px each with 4px gaps: 512px, the card's full inner width. */
      .steps { display: flex; gap: 4px; margin: 0 0 18px; }
      .steps span { width: 168px; height: 12px; flex: none; background: var(--paper); border: 3px solid var(--ink); }
      .steps span.on { background: var(--gold); }
      .char { display: grid; place-items: center; margin: 3px 0 12px; }
      .row { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 18px; align-items: center; }
      .ok { color: var(--teal-deep); }
      .err { color: var(--red); }
      ul { color: var(--muted); padding-left: 21px; margin: 0 0 12px; }
      li { margin: 0 0 3px; }
      .privacy { background: var(--paper); border: 3px solid var(--ink); padding: 12px 15px; }
      .privacy p { color: var(--ink); }
      .privacy p:last-child { margin-bottom: 0; }
      .server { margin-top: 12px; }
      code { font-family: var(--font-plain); font-size: 17px; background: var(--paper); border: 3px solid var(--ink); padding: 0 6px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="fx.js"></script>
    <script src="onboarding.js"></script>
  </body>
</html>
