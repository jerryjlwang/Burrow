<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Meet Pip</title>
    <style>
      :root { color-scheme: light dark; --accent: #7c5cff; --accent-2: #ff9a78; --fg: #1c1a2e; --muted: #6b6884; --bg: #f7f5ff; --card: #fff; --line: rgba(28,26,46,.08); }
      @media (prefers-color-scheme: dark) { :root { --fg: #f3f0ff; --muted: #b3adcc; --bg: #15132a; --card: #1e1b30; --line: rgba(255,255,255,.1); } }
      * { box-sizing: border-box; }
      body { margin: 0; font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: radial-gradient(1200px 600px at 20% -10%, rgba(124,92,255,.18), transparent), radial-gradient(900px 500px at 110% 10%, rgba(255,154,120,.2), transparent), var(--bg); color: var(--fg); min-height: 100vh; display: grid; place-items: center; padding: 24px; }
      #root { width: 100%; max-width: 560px; }
      .card { background: var(--card); border: 1px solid var(--line); border-radius: 24px; padding: 32px; box-shadow: 0 24px 60px rgba(30,20,70,.16); }
      h1 { margin: 0 0 8px; font-size: 28px; letter-spacing: -0.02em; }
      p { color: var(--muted); line-height: 1.55; margin: 0 0 14px; }
      .steps { display: flex; gap: 6px; margin-bottom: 20px; }
      .steps span { height: 6px; flex: 1; border-radius: 3px; background: var(--line); }
      .steps span.on { background: var(--accent); }
      .row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 18px; align-items: center; }
      .btn { border: 1px solid var(--line); background: var(--card); color: var(--fg); border-radius: 999px; padding: 10px 18px; font-weight: 600; cursor: pointer; font-size: 14px; font-family: inherit; }
      .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
      .btn:disabled { opacity: .5; cursor: default; }
      .char { display: grid; place-items: center; margin: 4px 0 16px; }
      .ok { color: #16a34a; font-weight: 600; }
      .err { color: #e11d48; font-weight: 600; }
      ul { color: var(--muted); line-height: 1.6; padding-left: 20px; }
      .privacy { background: rgba(124,92,255,.08); border-radius: 14px; padding: 14px 16px; font-size: 14px; }
      .pip-char { margin: 0 auto; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="onboarding.js"></script>
  </body>
</html>
