<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Meet the White Rabbit</title>
    <link rel="stylesheet" href="burrow.css" />
    <style>
      body { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
      #root { width: 100%; max-width: 560px; }
      .card { padding: 6px 9px 9px; border: 15px solid transparent; border-image: url("ui/bubble.png") 5 fill / 15px repeat; image-rendering: pixelated; box-shadow: var(--shadow); }
      h1 { margin: 0 0 9px; font-size: 30px; }
      p { color: var(--muted); line-height: 1.4; margin: 0 0 12px; }
      .steps { display: flex; gap: 6px; margin-bottom: 18px; }
      .steps span { height: 9px; flex: 1; background: var(--paper); border: 3px solid var(--ink); }
      .steps span.on { background: var(--gold); }
      .row { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 18px; align-items: center; }
      .btn { display: inline-grid; place-items: center; border: 12px solid transparent; border-image: url("ui/button.png") 4 fill / 12px repeat; image-rendering: pixelated; background: none; color: var(--ink); cursor: pointer; padding: 0 9px; min-height: 45px; font-size: 18px; line-height: 1; box-shadow: 3px 3px 0 rgba(59, 42, 35, 0.2); }
      .btn:active { transform: translate(3px, 3px); box-shadow: none; }
      .btn:disabled { opacity: 0.5; cursor: default; }
      .btn.primary { border-image-source: url("ui/button_primary.png"); color: var(--paper); }
      .char { display: grid; place-items: center; margin: 3px 0 12px; }
      .ok { color: var(--teal-deep); }
      .err { color: var(--red); }
      ul { color: var(--muted); line-height: 1.5; padding-left: 21px; margin: 0 0 12px; }
      .privacy { background: var(--paper); border: 3px solid var(--ink); padding: 12px 15px; font-size: 17px; }
      .privacy p { color: var(--ink); }
      code { font-family: var(--font-plain); font-size: 17px; background: var(--paper); border: 3px solid var(--ink); padding: 0 6px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="fx.js"></script>
    <script src="onboarding.js"></script>
  </body>
</html>
