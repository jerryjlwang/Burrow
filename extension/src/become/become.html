<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Become someone new</title>
    <link rel="stylesheet" href="burrow.css" />
    <style>
      /* Same card as onboarding: fixed top offset, 560 wide, 512 inside the frame. */
      body { padding: 48px 24px 60px; }
      #root { width: 100%; max-width: 560px; margin: 0 auto; }
      .card { padding: 6px 9px 9px; }
      h1 { margin: 0 0 9px; font-size: 30px; line-height: 36px; }
      h2 { font-size: 20px; line-height: 24px; margin: 12px 0 6px; }
      p { color: var(--muted); margin: 0 0 12px; }
      .row { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 12px; align-items: center; }
      .ok { color: var(--teal-deep); }
      .err { color: var(--red); margin: 0 0 12px; }
      /* The camera: a 4:3 window with the guide frame drawn over it. */
      .cam { position: relative; width: 512px; height: 384px; background: var(--ink); border: 3px solid var(--ink); overflow: hidden; }
      .cam video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); display: block; }
      .cam .guide { position: absolute; left: 50%; top: 50%; width: 246px; height: 246px; transform: translate(-50%, -50%); border: 3px dashed var(--gold); box-shadow: 0 0 0 999px rgba(59, 42, 35, 0.45); pointer-events: none; }
      .cam .hint { position: absolute; left: 0; right: 0; bottom: 9px; text-align: center; color: var(--paper); text-shadow: 0 0 3px var(--ink); pointer-events: none; }
      .cam.off { display: grid; place-items: center; color: var(--paper); }
      /* Tuning: the snapshot beside the sprite at 4x, then the sliders. */
      .pair { display: flex; gap: 12px; align-items: flex-start; }
      .pair canvas { image-rendering: pixelated; border: 3px solid var(--ink); background: var(--paper); }
      .pair .photo { width: 246px; height: 246px; object-fit: contain; background-image: linear-gradient(45deg, rgba(59, 42, 35, 0.06) 25%, transparent 25%, transparent 75%, rgba(59, 42, 35, 0.06) 75%), linear-gradient(45deg, rgba(59, 42, 35, 0.06) 25%, transparent 25%, transparent 75%, rgba(59, 42, 35, 0.06) 75%); background-size: 24px 24px; background-position: 0 0, 12px 12px; }
      .pair .sprite { width: 256px; height: 232px; background-image: linear-gradient(45deg, rgba(59, 42, 35, 0.06) 25%, transparent 25%, transparent 75%, rgba(59, 42, 35, 0.06) 75%), linear-gradient(45deg, rgba(59, 42, 35, 0.06) 25%, transparent 25%, transparent 75%, rgba(59, 42, 35, 0.06) 75%); background-size: 24px 24px; background-position: 0 0, 12px 12px; }
      .knobs { display: grid; grid-template-columns: 138px 1fr 48px; gap: 6px 12px; align-items: center; margin-top: 12px; }
      .knobs input[type="range"] { accent-color: var(--teal); width: 100%; }
      .knobs .val { text-align: right; font-family: var(--font-digits); font-size: 20px; }
      .paint { margin-top: 12px; padding: 9px 12px 12px; border: 3px solid var(--ink); background: var(--paper); }
      .paint .who .px-input { line-height: 24px; }
      .paint .mode { margin-bottom: 9px; }
      .paint .row { margin-top: 9px; }
      .paint .note { flex: 1; min-width: 200px; color: var(--muted); }
      .paint .err.note { color: var(--red); margin: 0; }
      .name { margin-top: 12px; }
      .name .px-input { line-height: 24px; }
      /* The live preview: a stage the pet stands on, as on a page, light and dark halves. */
      .stage { position: relative; display: flex; height: 210px; margin-top: 12px; border: 3px solid var(--ink); overflow: hidden; }
      .stage .half { flex: 1; position: relative; }
      .stage .half.light { background: #ffffff; }
      .stage .half.dark { background: #0f1115; }
      .stage .half .pip-root { position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); pointer-events: auto; }
      .states { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 9px; }
      .states .px-btn { min-height: 36px; font-size: 17px; }
      .states .px-btn.on { border-image-source: url("ui/button_primary.png"); color: var(--paper); }
      .done { background: var(--paper); border: 3px solid var(--ink); padding: 12px 15px; margin-top: 12px; }
      .done p { color: var(--ink); margin: 0; }
      .file { display: none; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="fx.js"></script>
    <script src="become.js"></script>
  </body>
</html>
