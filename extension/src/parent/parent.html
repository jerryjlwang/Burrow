<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Burrow, parent view</title>
    <link rel="stylesheet" href="burrow.css" />
    <style>
      /* The rabbit lives fixed in the bottom right corner; the column stays out of a 220px zone there. */
      main { max-width: 888px; margin: 0 auto; padding: 30px 24px 240px; display: flex; flex-direction: column; gap: 36px; }
      @media (max-width: 1327px) { main { margin-right: 220px; } }
      .plain { font-family: var(--font-plain); }
      section h2 { margin: 0 0 6px; }
      .lede { color: var(--muted); margin: 0 0 15px; font-size: 17px; line-height: 1.4; }
      .tag { font-size: 15px; line-height: 21px; padding: 0 6px; background: var(--gold); border: 3px solid var(--ink); color: var(--ink); white-space: nowrap; font-family: var(--font); }
      .meta { margin: 0; font-size: 15px; color: var(--muted); line-height: 1.4; }
      .k { color: var(--muted); }

      /* Header */
      .hero .px-band { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 18px; padding: 9px 12px; }
      .hero h1 { font-size: 30px; }
      .hero .status { margin: 0; font-size: 17px; color: rgba(255, 253, 245, 0.9); }
      .hero .intro { margin: 12px 9px 3px; font-size: 17px; line-height: 1.45; color: var(--muted); }

      /* Map of the burrow: the concept graph drawn on a canvas inside a cream frame */
      .graph-wrap { position: relative; padding: 0; line-height: 0; }
      .graph-canvas { display: block; margin: 0 auto; image-rendering: pixelated; touch-action: none; }
      .graph-tip { position: absolute; z-index: 2; pointer-events: none; width: max-content; max-width: 258px; padding: 0 3px; font-size: 15px; line-height: 1.35; }
      .graph-tip b { display: block; font-family: var(--font); font-weight: 400; font-size: 17px; line-height: 1.2; margin-bottom: 3px; }

      /* Rooms: one per concept */
      .rooms { display: grid; grid-template-columns: repeat(auto-fill, minmax(255px, 1fr)); gap: 15px; }
      .room { padding: 3px 6px 6px; }
      .room.faded { opacity: 0.55; }
      .room.flash { outline: 6px solid var(--gold); outline-offset: -3px; animation: room-flash 0.5s steps(1, end) 3; }
      @keyframes room-flash { 50% { outline-color: transparent; } }
      .room-top { display: flex; flex-wrap: wrap; align-items: center; gap: 9px; margin-bottom: 9px; min-height: 30px; }
      .door { width: 15px; height: 27px; background: var(--ink); position: relative; flex-shrink: 0; }
      .door::after { content: ""; position: absolute; right: 3px; top: 12px; width: 3px; height: 3px; background: var(--gold); }
      .room h3 { font-size: 20px; flex: 1; min-width: 0; }
      .bar { width: 156px; height: 15px; border: 3px solid var(--ink); background: var(--paper); margin-bottom: 9px; }
      .bar span { display: block; height: 100%; background: var(--teal); }

      /* Shaky spots */
      .spots { display: grid; gap: 15px; }
      .spot { padding: 3px 6px 6px; }
      .spot h3 { font-size: 20px; margin-bottom: 6px; display: flex; gap: 9px; align-items: center; flex-wrap: wrap; }
      .spot p { margin: 0 0 6px; font-size: 17px; line-height: 1.45; }
      .spot .ask { border-left: 6px solid var(--gold); padding: 3px 0 3px 9px; margin: 9px 0; }
      .spot.resolved { opacity: 0.8; }
      .spot.resolved p { margin: 0; }

      /* Skills the rabbit may be granted */
      .skills { display: grid; grid-template-columns: repeat(auto-fill, minmax(255px, 1fr)); gap: 15px; }
      .skill { padding: 3px 6px 6px; align-items: flex-start; }
      .skill input { margin-top: 4px; flex-shrink: 0; }
      .skill strong { display: block; font-weight: 400; font-size: 20px; margin-bottom: 3px; }
      .skill .blurb { display: block; font-size: 17px; color: var(--muted); line-height: 1.4; }

      /* The rabbit: call him over, send him back, what he brought */
      .row { display: flex; gap: 12px; flex-wrap: wrap; margin: 0 0 15px; }
      .summary { padding: 3px 6px 6px; font-size: 17px; line-height: 1.45; }
      .summary .k { display: block; font-size: 15px; margin-bottom: 3px; }
      /* The notes he brought back are a scroll, the same one he unrolls beside him; a new one flashes gold. */
      .summary.notes { border-image-source: url("ui/scroll.png"); padding: 6px 9px 9px; }
      .summary.flash { animation: notes-flash 0.5s steps(1, end) 3; }
      @keyframes notes-flash { 50% { box-shadow: var(--shadow), 0 0 0 6px var(--gold); } }
      /* While he is on his way the status line counts the steps: one dot, two, three, none. */
      .dots i { font-style: normal; opacity: 0; animation: dot 1.2s steps(1, end) infinite; }
      .dots i:nth-child(2) { animation-name: dot-2; }
      .dots i:nth-child(3) { animation-name: dot-3; }
      @keyframes dot { 0%, 24% { opacity: 0; } 25%, 100% { opacity: 1; } }
      @keyframes dot-2 { 0%, 49% { opacity: 0; } 50%, 100% { opacity: 1; } }
      @keyframes dot-3 { 0%, 74% { opacity: 0; } 75%, 100% { opacity: 1; } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="fx.js"></script>
    <script src="parent.js"></script>
  </body>
</html>
