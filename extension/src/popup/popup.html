<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Burrow</title>
    <link rel="stylesheet" href="burrow.css" />
    <style>
      body { width: 320px; font-size: 15px; }
      .wrap { padding: 12px; }
      h1 { font-size: 22px; margin: 0; }
      .sub { color: var(--muted); margin: 0 0 12px; }
      .status { display: flex; gap: 9px; align-items: center; margin-bottom: 9px; padding: 0; }
      .dot { width: 12px; height: 12px; background: var(--muted); border: 3px solid var(--ink); flex-shrink: 0; }
      .dot.ok { background: var(--teal); }
      .dot.bad { background: var(--red); }
      label.t { display: flex; align-items: center; gap: 9px; padding: 6px 0; cursor: pointer; }
      label.t input[type="checkbox"] { accent-color: var(--teal); width: 18px; height: 18px; margin: 0; }
      .row { display: flex; gap: 9px; flex-wrap: wrap; margin-top: 12px; }
      .btn { display: inline-grid; place-items: center; border: 12px solid transparent; border-image: url("ui/button.png") 4 fill / 12px repeat; image-rendering: pixelated; background: none; color: var(--ink); cursor: pointer; padding: 0 3px; min-height: 36px; font-size: 15px; line-height: 1; box-shadow: 3px 3px 0 rgba(59, 42, 35, 0.2); }
      .btn:active { transform: translate(3px, 3px); box-shadow: none; }
      .btn:disabled { opacity: 0.5; cursor: default; }
      .btn.primary { border-image-source: url("ui/button_primary.png"); color: var(--paper); }
      input.url { display: block; width: 100%; min-height: 42px; border: 15px solid transparent; border-image: url("ui/bubble.png") 5 fill / 15px repeat; image-rendering: pixelated; background: none; padding: 0; outline: none; margin-top: 3px; font-size: 15px; }
      input.url:focus { box-shadow: 0 0 0 3px var(--gold); }
      .muted { color: var(--muted); }
    </style>
  </head>
  <body>
    <div id="root" class="wrap"></div>
    <script src="popup.js"></script>
  </body>
</html>
