<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Burrow</title>
    <link rel="stylesheet" href="burrow.css" />
    <style>
      /* The toolbar popup is the product's card: 320px wide, cream frame, his face on the teal band, one status
         line, pixel buttons and the panel's toggles. Chrome sizes the popup to the body, so nothing may scroll:
         every row is a whole number of pixels and the card stays well under Chrome's 600px limit. */
      html, body { height: auto; overflow: hidden; }
      body { width: 320px; margin: 0 auto; padding: 12px; line-height: 21px; }
      .card { display: block; }
      .head { display: flex; align-items: center; gap: 9px; padding: 6px 9px 6px 6px; background: var(--teal); color: var(--paper); border-bottom: 3px solid var(--gold); }
      .face { display: block; width: 48px; height: 48px; image-rendering: pixelated; flex-shrink: 0; }
      .who { display: flex; flex-direction: column; min-width: 0; }
      .who strong { font-weight: 400; font-size: 20px; line-height: 24px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .line { display: flex; align-items: center; gap: 6px; font-size: 17px; line-height: 21px; white-space: nowrap; }
      .dot { width: 9px; height: 9px; background: var(--paper); flex-shrink: 0; }
      .dot.bad { background: var(--red); }
      .dot.live { background: var(--gold); animation: blink 1.2s steps(2) infinite; }
      .dot.wait { animation: blink 0.6s steps(2) infinite; }
      @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
      .body { padding: 9px 6px 6px; display: flex; flex-direction: column; gap: 9px; }
      .note { margin: 0; color: var(--muted); }
      /* Two real actions as full-width pixel buttons (half-width cells cannot hold 17px labels at 320px),
         then the three pages as the same underlined links the panel's settings block uses. */
      .actions { display: flex; flex-direction: column; gap: 6px; }
      .actions .px-btn { display: grid; width: 100%; }
      .links { display: flex; gap: 15px; flex-wrap: wrap; padding-top: 3px; }
      .link { border: 0; background: none; color: var(--teal-deep); cursor: pointer; padding: 0; font: 17px/21px var(--font); text-decoration: underline; text-decoration-thickness: 3px; text-underline-offset: 3px; }
      .settings { display: flex; flex-direction: column; gap: 3px; padding-top: 9px; border-top: 3px solid var(--ink); }
      .settings .px-toggle { min-height: 30px; }
      .server { display: flex; flex-direction: column; gap: 3px; padding-top: 9px; border-top: 3px solid var(--ink); }
      .server .px-input { line-height: 21px; }
      .model { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="popup.js"></script>
  </body>
</html>
